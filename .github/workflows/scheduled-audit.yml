name: Scheduled Security Audit

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: Full audit + scan
        id: audit
        run: node scripts/run-all-scans.js
        continue-on-error: true

      - name: Open GitHub Issue on failure
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Security Audit Failed — ${new Date().toISOString().split('T')[0]}`,
              body: `The scheduled npm publish security audit failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease review and remediate immediately.`,
              labels: ['security', 'automated'],
            });
