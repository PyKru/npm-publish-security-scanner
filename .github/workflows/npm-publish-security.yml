name: npm Publish Security Gate

on:
  push:
    branches: [main, master, release/**]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after passing all checks?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run composite security action
        id: security
        uses: ./.github/actions/npm-publish-security-scan
        with:
          node-version: '20'
          install-command: 'npm ci --ignore-scripts'
          build-command: 'npm run build --if-present'
          audit-level: 'high'
          allowed-map-files: ''
          max-file-mb: '5'
          max-total-mb: '50'
          upload-artifact: 'true'

      - name: Fail if security scan failed
        if: ${{ steps.security.outputs.overall != 'PASS' }}
        run: |
          echo "::error::Security scan failed."
          exit 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: security-scan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --if-present

      - name: Publish with provenance
        run: npm publish --provenance --access public
